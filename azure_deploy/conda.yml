name: energy-inference-environment
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      # same versions as training, so the pickled model loads cleanly
      - pandas==3.1.0
      - numpy==2.5.4
      - scikit-learn==1.9.1
      - joblib==1.6.0
      - azureml-inference-server-http
